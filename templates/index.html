<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Menu App - Panel Selection</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="/static/css/index.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="background-container">
    <div class="overlay"></div>
  </div>
  
  <!-- Header Navigation -->
  <header class="header">
    <div class="container">
      <div class="header-content">
        <div class="logo-container">
          <div class="logo-icon">
            <img src="/static/images/logo.png" alt="Logo" style="width:40px;height:40px;">
          </div>
          <h1>Menu App</h1>
        </div>
        
        <div class="user-menu">
          <button id="goProfile" class="btn-secondary" style="display:none">Profile</button>
          <button id="signOutBtn" class="btn-logout" style="display:none">Sign Out</button>
        </div>
      </div>
    </div>
  </header>

  <!-- Panel Selection Section -->
  <main class="panel-selection">
    <div class="glass-card">
      <div class="card-header">
        <h2>Select Panel</h2>
        <p class="subtitle">Choose your role to continue</p>
      </div>

      <div class="panels-grid">
        <div class="panel-card" data-panel="user" id="userPanel">
          <div class="panel-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
          <h3>User Panel</h3>
          <p>Browse menu and place orders</p>
          <div class="panel-arrow">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </div>
        </div>

        <div class="panel-card" data-panel="waiter" id="waiterPanel">
          <div class="panel-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
          </div>
          <h3>Waiter Panel</h3>
          <p>Manage tables and orders</p>
          <div class="panel-arrow">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </div>
        </div>

        <div class="panel-card" data-panel="admin" id="adminPanel">
          <div class="panel-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 20V10"></path>
              <path d="M18 20V4"></path>
              <path d="M6 20v-4"></path>
            </svg>
          </div>
          <h3>Admin Panel</h3>
          <p>Manage restaurant settings</p>
          <div class="panel-arrow">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </div>
        </div>

        <div class="panel-card" data-panel="kitchen" id="kitchenPanel">
          <div class="panel-icon">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12h20"></path>
              <path d="M2 12h2v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8h2"></path>
              <path d="M8 12V8a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v4"></path>
            </svg>
          </div>
          <h3>Kitchen Panel</h3>
          <p>Manage food preparation</p>
          <div class="panel-arrow">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="toast-container" id="toastContainer"></div>

  <script type="module">
    // Use same firebaseConfig as signin/signup pages
    const firebaseConfig = {
      apiKey: "AIzaSyAAB177RRF5ds2ADVc6GIxdwJw5najJuWI",
      authDomain: "restaurants-menu-system.firebaseapp.com",
      projectId: "restaurants-menu-system",
      storageBucket: "restaurants-menu-system.firebasestorage.app",
      messagingSenderId: "801085410696",
      appId: "1:801085410696:web:2a4e2e94f5fe463f323e3d",
      measurementId: "G-HTDEV5LL3Z"
    };

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.10.0/firebase-auth.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const profileBtn = document.getElementById("goProfile");
    const signOutBtn = document.getElementById("signOutBtn");
    const toastContainer = document.getElementById("toastContainer");
    const panelCards = document.querySelectorAll('.panel-card');
    const userPanel = document.getElementById('userPanel');
    const waiterPanel = document.getElementById('waiterPanel');
    const adminPanel = document.getElementById('adminPanel');
    const kitchenPanel = document.getElementById('kitchenPanel');

    // Toast notification function
    function showToast(message, type = 'info') {
      const toast = document.createElement('div');
      toast.className = `toast ${type}`;
      
      let iconSvg = '';
      if (type === 'success') {
        iconSvg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';
      } else if (type === 'error') {
        iconSvg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>';
      } else {
        iconSvg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>';
      }
      
      toast.innerHTML = `
        <div class="toast-icon">${iconSvg}</div>
        <div class="toast-message">${message}</div>
      `;
      
      toastContainer.appendChild(toast);
      
      // Trigger animation
      setTimeout(() => {
        toast.classList.add('show');
      }, 100);
      
      // Auto remove after 3 seconds
      setTimeout(() => {
        toast.classList.remove('show');
        setTimeout(() => {
          if (toast.parentNode) {
            toast.parentNode.removeChild(toast);
          }
        }, 300);
      }, 3000);
    }

    onAuthStateChanged(auth, (user) => {
      if (!user) {
        // Not signed in -> go to sign in page
        window.location.href = "/signin";
        return;
      }

      // Signed in - show user menu
      profileBtn.style.display = "inline-block";
      signOutBtn.style.display = "inline-block";
      
      // Show welcome toast
      showToast(`Welcome back, ${user.email}!`, 'success');
    });

    profileBtn.addEventListener("click", () => {
      window.location.href = "/profile";
    });

    signOutBtn.addEventListener("click", async () => {
      try {
        await signOut(auth);
        showToast("Signed out successfully", 'success');
        setTimeout(() => window.location.href = "/signin", 1000);
      } catch (e) {
        showToast("Sign out failed: " + e.message, 'error');
      }
    });

    userPanel.addEventListener("click", () => {
      window.location.href = "/user";
    });

    waiterPanel.addEventListener("click", () => {
      window.location.href = "/waiter";
    });

    adminPanel.addEventListener("click", () => {
      window.location.href = "/admin";
    });

    kitchenPanel.addEventListener("click", () => {
      window.location.href = "/kitchen";
    });
    

    
  </script>
</body>
</html>
